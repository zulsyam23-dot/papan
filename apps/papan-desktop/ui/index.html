<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAPAN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="brand">PAPAN <span class="sub">PCB Editor</span></div>
        <input id="project-path" class="path" placeholder="Project path (folder / .papan / .pn)" />
        <button id="open-btn">Open</button>
        <button id="check-btn">Check Source</button>
        <button id="fit-btn">Zoom Fit</button>
        <span id="app-info" class="muted"></span>
      </header>
      <div class="workspace">
        <aside class="sidebar">
          <section>
            <h3>Board</h3>
            <div id="board-info" class="info muted">No project loaded.</div>
          </section>
          <section>
            <h3>Layers</h3>
            <div id="layers" class="list"></div>
          </section>
          <section>
            <h3>Nets</h3>
            <div id="nets" class="list"></div>
          </section>
          <section>
            <h3>Components</h3>
            <div id="components" class="list"></div>
          </section>
        </aside>
        <main class="center">
          <div class="canvas-wrap">
            <svg id="board-canvas" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="canvas-hint" class="hint">Open proyek PAPAN atau tulis source, lalu Open/Check.</div>
          </div>
          <section class="bottom">
            <div class="bottom-tabs"><strong>Diagnostics</strong> <span id="diag-summary" class="muted"></span></div>
            <pre id="diagnostics"></pre>
          </section>
        </main>
        <aside class="right">
          <section>
            <h3>Source</h3>
            <textarea id="source" spellcheck="false" placeholder="; PAPAN source (.pn)"></textarea>
          </section>
        </aside>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
