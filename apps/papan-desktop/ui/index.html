<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAPAN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>PAPAN Desktop</h1>
      <p id="app-info" class="muted"></p>
    </header>
    <main>
      <section class="panel">
        <h2>Project</h2>
        <div class="row">
          <input id="project-path" placeholder="Path ke folder project .papan / .pn / direktori" />
          <button id="open-btn">Open &amp; Check</button>
        </div>
        <div id="project-summary" class="muted"></div>
      </section>
      <section class="panel grid">
        <div>
          <h2>Source (.pn)</h2>
          <textarea id="source" spellcheck="false"></textarea>
          <div class="row">
            <button id="check-btn">Check Source</button>
          </div>
        </div>
        <div>
          <h2>Diagnostics</h2>
          <pre id="diagnostics"></pre>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
