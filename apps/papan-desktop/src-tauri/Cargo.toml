[package]
name = "papan-desktop"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "PAPAN desktop PCB design app (Tauri)"
publish = false

[lib]
name = "papan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
papan-api = { path = "../../../crates/papan-api" }
papan-document = { path = "../../../crates/papan-document" }
papan-types = { path = "../../../crates/papan-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
